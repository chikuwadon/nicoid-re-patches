name: Temporary CodeQL workflow lock generation
on:
  push:
    branches: [audit/codeql-morphe-manual]
    paths:
      - .github/workflows/codeql-advanced.yml
      - .github/workflows/codeql-manual-probe.yml
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate official dependency lockfile without this temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-actions-lock --pin v0.4.1
          rm .github/workflows/codeql-manual-probe.yml
          gh actions-lock --no-narrow
          gh actions-lock --verify
          gh actions-lock --verify-local
      - name: Emit generated lockfile for reviewed repository update
        run: |
          echo 'CODEQL_LOCK_BEGIN'
          cat .github/workflows/actions.lock
          echo 'CODEQL_LOCK_END'
