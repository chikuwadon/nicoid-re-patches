name: Publish prepared pre-release

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['.github/workflows/publish-prepared-prerelease.yml']

permissions:
  contents: write
  packages: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'build: publish prepared prerelease')
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: 1.9.6-dev.1
      RELEASE_COMMIT: 75499b3a7c1abf557935eb2a54439cb72ed436b7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1.9.6-dev.1
          fetch-depth: 0
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify prepared release
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          grep -Fx "version = $RELEASE_VERSION" gradle.properties
          test -f ".github/release-notes/v$RELEASE_VERSION.md"
      - name: Build release bundle
        run: ./gradlew :patches:buildAndroid --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle="patches/build/libs/patches-$RELEASE_VERSION.mpp"
          test -s "$bundle"
          printf '## %s (%s)\n\n' "$RELEASE_VERSION" "$(TZ=Asia/Tokyo date +%F)" > /tmp/release-notes.md
          cat ".github/release-notes/v$RELEASE_VERSION.md" >> /tmp/release-notes.md
          if gh release view "v$RELEASE_VERSION" > /dev/null 2>&1; then
            gh release edit "v$RELEASE_VERSION" --prerelease --latest=false --notes-file /tmp/release-notes.md
            gh release upload "v$RELEASE_VERSION" "$bundle" --clobber
          else
            gh release create "v$RELEASE_VERSION" "$bundle" --verify-tag --prerelease --latest=false --title "v$RELEASE_VERSION" --notes-file /tmp/release-notes.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: published-prerelease
          path: patches/build/libs/*.mpp
          if-no-files-found: error
