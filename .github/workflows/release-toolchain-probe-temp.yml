name: Temporary release-toolchain lockfile migration (audit branch only)

on:
  push:
    branches: [audit/release-tooling-compat-20261116]

permissions:
  contents: write

jobs:
  refresh-and-check:
    if: github.ref == 'refs/heads/audit/release-tooling-compat-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Generate reproducible npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node .github/scripts/verify-release-npm.cjs
          node .github/scripts/test-release-toolchain.cjs
          node --input-type=module -e "await import('semantic-release');"
      - name: Save lockfile on isolated audit branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/audit/release-tooling-compat-20261116'
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: regenerate lockfile for stable release tooling'
            git push origin HEAD:refs/heads/audit/release-tooling-compat-20261116
          fi
