name: Temporary release-toolchain compatibility probe

on:
  push:
    branches: [audit/release-tooling-compat-20261116]

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Inspect stable npm releases
        shell: bash
        run: |
          set -euo pipefail
          node -v
          npm -v
          npm view semantic-release dist-tags --json
          npm view semantic-release@26.0.1 version engines --json || true
          npm view conventional-changelog-conventionalcommits dist-tags --json
          npm view @semantic-release/release-notes-generator dist-tags --json
          npm view conventional-changelog-writer dist-tags --json
          npm view conventional-commits-parser dist-tags --json
