name: Sync release notes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-release-notes.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update release descriptions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in v1.3.0 v1.3.1 v1.3.2; do
            gh release edit "$tag" --notes-file ".github/release-notes/$tag.md" --repo "$GITHUB_REPOSITORY"
          done
