name: Temporary minimatch lockfile regeneration
on:
  push:
    branches: [security/minimatch-bundled-risk-guard]
    paths:
      - package.json
      - .github/stubs/semantic-release-npm-disabled/**
      - .github/workflows/temporary-minimatch-lock.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Re-resolve the approved build tooling
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const l = require('./package-lock.json');
          for (const p of ['node_modules/@semantic-release/npm','node_modules/npm','.github/stubs/semantic-release-npm-disabled']) console.log(p, l.packages[p]);
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          node .github/scripts/verify-release-npm.cjs
          node --input-type=module -e "await import('semantic-release'); console.log('Release CLI import successful')"
          npm ls @semantic-release/npm npm minimatch || true
      - name: Commit regenerated lockfile to this test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(security): regenerate lockfile without unused npm CLI"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
