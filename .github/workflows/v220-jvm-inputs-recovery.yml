name: Recover v2.2.0 complete JVM classpaths (no release)
on:
  push:
    branches: [recovery/v2.2.0-jvm-inputs]
permissions:
  contents: read
  packages: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAVA_TOOL_OPTIONS: '-XX:-UseBASE64Intrinsics'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 28b745dbb29cea0c309d827d78c5940066bfe98d
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
      - name: Resolve complete baseline patcher classpaths
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          export NICOID_RECOVERY_DIR="$RUNNER_TEMP/nicoid-v220-runtime-inputs"
          mkdir -p "$NICOID_RECOVERY_DIR"
          cat > "$RUNNER_TEMP/nicoid-recovery.init.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
              def p = gradle.rootProject.findProject(':patches')
              p.tasks.register('recoverV220RuntimeInputs') {
                  doLast {
                      def out = new File(System.getenv('NICOID_RECOVERY_DIR'))
                      ['compileClasspath', 'runtimeClasspath', 'patchListGeneratorClasspath'].each { name ->
                          def c = p.configurations.getByName(name)
                          def rows = []
                          c.resolvedConfiguration.resolvedArtifacts.each { a ->
                              def id = a.moduleVersion.id
                              def rel = "${name}/${id.group}/${id.name}/${id.version}/${a.file.name}"
                              def dst = new File(out, rel)
                              dst.parentFile.mkdirs()
                              java.nio.file.Files.copy(a.file.toPath(), dst.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                              rows.add(rel)
                              def cache = new File(gradle.gradleUserHomeDir, "caches/modules-2/files-2.1/${id.group}/${id.name}/${id.version}")
                              if (cache.isDirectory()) {
                                  cache.eachFileRecurse { f ->
                                      if (f.isFile() && (f.name.endsWith('.pom') || f.name.endsWith('.module'))) {
                                          def meta = new File(out, "metadata/${id.group}/${id.name}/${id.version}/${f.name}")
                                          meta.parentFile.mkdirs()
                                          java.nio.file.Files.copy(f.toPath(), meta.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                                      }
                                  }
                              }
                          }
                          new File(out, "${name}.txt").text = rows.join('\n') + '\n'
                      }
                  }
              }
          }
          GRADLE
          ./gradlew -I "$RUNNER_TEMP/nicoid-recovery.init.gradle" :patches:recoverV220RuntimeInputs --no-daemon
          cd "$NICOID_RECOVERY_DIR"
          python3 - <<'PY'
          import pathlib, zipfile
          paths=list(pathlib.Path('runtimeClasspath').rglob('*.jar'))
          assert paths
          required={'com/reandroid/archive/io/InflatingInputStream.class','com/android/tools/smali/dexlib2/Opcode.class','app/morphe/patcher/Patcher.class'}
          for jar in paths:
              with zipfile.ZipFile(jar) as z:
                  required.difference_update(z.namelist())
          assert not required, required
          print('Verified required runtime classes')
          PY
          find . -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/runtime-SHA256SUMS"
          mv "$RUNNER_TEMP/runtime-SHA256SUMS" SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nicoid-v220-runtime-inputs
          path: ${{ runner.temp }}/nicoid-v220-runtime-inputs/
          retention-days: 3
          if-no-files-found: error
