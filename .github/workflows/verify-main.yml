name: Verify main source and patch build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: verify-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and compile MPP
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate workflow action pinning and release safeguards
        run: python3 porting/tests/VerifyGithubActionsSecurity.py
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify version, metadata and immutable release sources
        run: python3 porting/tests/VerifyReleaseBaseline.py
      - name: Verify helper source ownership before release
        run: python3 porting/tests/VerifyCanonicalHelpers.py
      - name: Make Gradle dependency downloads resilient
        run: |
          sed -i 's#https\\://services.gradle.org/distributions/gradle-9.8.2-bin.zip#https\\://downloads.gradle.org/distributions/gradle-9.8.2-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/^networkTimeout=.*/networkTimeout=180000/' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/^retries=.*/retries=2/' gradle/wrapper/gradle-wrapper.properties
          printf '\nsystemProp.org.gradle.internal.http.connectionTimeout=180000\nsystemProp.org.gradle.internal.http.socketTimeout=180000\n' >> gradle.properties
      - name: Audit release candidate source and lifecycle guards
        run: python3 porting/revisions/v1.11.0/release-readiness-audit.py
      - name: Build and run Gradle verification
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean :patches:buildAndroid :patches:generatePatchesList --no-daemon
      - name: Verify release candidate MPP and regressions
        run: |
          python3 porting/revisions/v1.11.0/verify-mpp.py 1.11.0
          python3 porting/tests/regression136.py
          python3 porting/tests/regression141.py
          python3 porting/tests/regression155.py
          python3 porting/tests/retained-notification-regression.py
          python3 porting/tests/tap-regions-regression.py
          python3 porting/tests/tap-region-ui-regression.py
      - name: Verify MPP was produced
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(patches/build/libs/*.mpp)
          test "${#bundles[@]}" -ge 1
          for bundle in "${bundles[@]}"; do
            test -s "$bundle"
            echo "Verified generated MPP: $bundle"
          done

  audit:
    name: Report build-tool dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Audit fixed npm and locked build dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node .github/scripts/verify-release-npm.cjs
          node --input-type=module -e "await import('semantic-release'); console.log('Release CLI import successful')"
          npm audit --json > /tmp/nicoid-npm-audit.json || true
          python3 - <<'PY'
          import json, os
          with open("/tmp/nicoid-npm-audit.json", encoding="utf-8") as f:
              data = json.load(f)
          counts = data.get("metadata", {}).get("vulnerabilities", {})
          text = "Build-tool npm audit (not an APK runtime audit): " + ", ".join(
              f"{key}={counts.get(key, 0)}"
              for key in ("critical", "high", "moderate", "low")
          )
          print(text)
          for name, info in sorted(data.get("vulnerabilities", {}).items()):
              if info.get("severity") in ("critical", "high"):
                  print(f"Security advisory: {name}: {info.get('severity')}, "
                        f"affected={info.get('range')}, fixAvailable={info.get('fixAvailable')}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Build-tool dependency audit\n\n" + text + "\n\n")
          PY

  cleanup-v111:
    name: Remove obsolete v1.11.0 development refs and artifacts
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore(maintenance): cleanup obsolete v1.11.0 development refs and artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - name: Verify published release and protect production refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chikuwadon/nicoid-re-patches"
          test "$GITHUB_REF" = "refs/heads/main"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.11.0" --jq '.draft == false and .prerelease == false' | grep -qx true
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.11.0" --jq '.ref' | grep -qx 'refs/tags/v1.11.0'
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          dev_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/dev" --jq '.commit.sha')
          test -n "$main_sha" && test "$main_sha" = "$dev_sha"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.11.0" --jq '.assets[].name' | grep -qx 'patches-1.11.0.mpp'
          echo "Verified v1.11.0 official release and synchronized main/dev: $main_sha"
      - name: Delete only approved obsolete audit and release branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'audit/gradle-10-compatibility'
            'audit/v1.10.7-dev.11-retained-return'
            'audit/v1.10.7-dev.12-issue-114'
            'audit/v1.10.7-dev.14-ui'
            'audit/v1.10.7-dev.15-ui-compact'
            'audit/v1.10.7-dev.16-ambient'
            'audit/v1.10.7-dev.17-ambient'
            'audit/v1.10.7-dev.18-ambient'
            'audit/v1.10.7-dev.19-final-fixes'
            'audit/v1.11.0-preflight'
            'release/v1.11.0-prep'
          )
          deleted=0
          for branch in "${branches[@]}"; do
            case "$branch" in
              audit/*|release/v1.11.0-prep) ;;
              *) echo "Unapproved branch: $branch" >&2; exit 1;;
            esac
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" --silent
              echo "Deleted branch: $branch"
              deleted=$((deleted+1))
            else
              echo "Already absent: $branch"
            fi
          done
          echo "Branches deleted: $deleted"
          echo "## Repository cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "Obsolete branches deleted: $deleted" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete stale development CI artifacts, never Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          # Only Actions artifacts named for development MPP and source verification.
          # Published GitHub Release assets are separate and are never addressed.
          while IFS=$'\t' read -r id name; do
            test -n "$id" || continue
            if [[ "$name" =~ ^nicoid-re-v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+-(mpp|source-verification)$ ]] ||
               [[ "$name" =~ ^nicoid-re-v1\.11\.0-(mpp|source-verification)$ ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" --silent
              echo "Deleted artifact: $id $name"
              deleted=$((deleted+1))
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .name] | @tsv')
          echo "Actions artifacts deleted: $deleted"
          echo "Development Actions artifacts deleted: $deleted" >> "$GITHUB_STEP_SUMMARY"
          echo "Official v1.11.0 Release assets and both protected branches remain unchanged." >> "$GITHUB_STEP_SUMMARY"
